:focus-visible{outline:3px solid var(--pink);outline-offset:3px;border-radius:6px}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:68px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:22px;color:var(--ink);text-decoration:none;letter-spacing:-.01em}
.brand img{width:34px;height:34px;object-fit:contain}
.btn{display:inline-flex;align-items:center;border-radius:999px;font-weight:600;font-size:15px;text-decoration:none;padding:10px 20px;background:var(--pink);color:#fff}
.btn:hover{background:var(--pink-d);color:#fff}
.hero{padding:56px 0 40px;border-bottom:1px solid var(--line)}
h1{font-size:clamp(36px,5.5vw,60px);line-height:1.05;letter-spacing:-.035em;font-weight:800;color:var(--ink)}
.meta{display:flex;flex-wrap:wrap;gap:8px 28px;margin-top:22px;color:var(--muted);font-size:15px}
.meta b{color:var(--ink);font-weight:600}
.layout{display:grid;grid-template-columns:260px 1fr;gap:64px;padding-top:48px;padding-bottom:80px}
aside nav{position:sticky;top:96px}
aside h4{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:12px}
aside ol{list-style:none;padding:0;display:grid;gap:2px;counter-reset:t;max-height:calc(100vh - 160px);overflow:auto}
aside li{counter-increment:t}
aside a{display:block;padding:6px 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-size:14.5px;font-weight:500}
aside a::before{content:counter(t) ". ";}
aside a:hover{background:var(--soft);color:var(--ink)}
aside a.on{background:var(--ink);color:#fff}
article{max-width:720px}
section{padding:0 0 44px;margin-bottom:44px;border-bottom:1px solid var(--line)}
section:last-of-type{border:0;margin:0}
h2{display:flex;gap:14px;align-items:baseline;font-size:28px;line-height:1.2;letter-spacing:-.025em;font-weight:800;color:var(--ink);margin-bottom:18px}
h2 span{flex:none;min-width:34px;height:34px;display:inline-grid;place-items:center;border-radius:50%;background:var(--pink);color:#fff;font-size:15px;font-weight:700;letter-spacing:0;transform:translateY(-3px)}
h3{font-size:18px;font-weight:700;color:var(--ink);margin:26px 0 10px}
p{margin-bottom:14px;font-size:16.5px}
ul{padding-left:0;list-style:none;margin:0 0 16px;display:grid;gap:7px}
li{position:relative;padding-left:22px;font-size:16.5px}
li::before{content:"";position:absolute;left:3px;top:.68em;width:8px;height:8px;border-radius:50%;background:var(--pink)}
dl{margin:4px 0 16px;border:1px solid var(--line);border-radius:18px;overflow:hidden}
dt{font-weight:700;color:var(--ink);padding:14px 18px 0;background:var(--soft);font-size:16px}
dd{padding:2px 18px 14px;background:var(--soft);border-bottom:1px solid var(--line);font-size:16px}
dd:last-child{border-bottom:0}
footer{border-top:1px solid var(--line);padding:28px 0 40px;color:var(--muted);font-size:14px}
.foot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}
.foot a{color:var(--muted)}.links{display:flex;gap:6px 20px;flex-wrap:wrap}ol.steps{padding:0;list-style:none;counter-reset:st;display:grid;gap:9px;margin:0 0 16px}ol.steps li{counter-increment:st;padding-left:40px}ol.steps li::before{content:counter(st);width:26px;height:26px;left:0;top:.2em;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}article,aside{min-width:0}
@media(max-width:900px){.layout{grid-template-columns:1fr;gap:28px;padding-top:28px}aside nav{position:static}aside ol{max-height:none;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:18px;padding:10px}}
@media(max-width:520px){aside ol{grid-template-columns:1fr}h2{font-size:24px}}
@media print{header,aside,footer{display:none}.layout{display:block;padding-top:0;padding-bottom:0}}
</style></head>
